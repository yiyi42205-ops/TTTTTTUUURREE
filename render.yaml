services:
  - type: web
    name: truerating
    runtime: python
    buildCommand: |
      pip install -r review_scraper/requirements.txt &&
      pip install gdown &&
      gdown 1Q_noGYRAtQt_Zqeg6UU_9ssrMDdlou1l -O cache.db &&
      npm install &&
      npm run build
    startCommand: cd review_scraper && gunicorn server:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: NODE_VERSION
        value: "20"
